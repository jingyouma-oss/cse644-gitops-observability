apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2h"]
          ports:
            - {name: http, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gitops-demo
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:13.1.3
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          ports:
            - {name: http, containerPort: 3000}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gitops-demo
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}

