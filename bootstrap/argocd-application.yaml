apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cse644-gitops-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jingyouma-oss/cse644-gitops-observability.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

